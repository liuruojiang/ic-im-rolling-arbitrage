name: Codex Put Real-Data Research

on:
  push:
    branches:
      - codex/im-put-size-realdata-20260902
    paths-ignore:
      - 'artifacts/cffex_mo_archive_diagnostic/**'
      - 'artifacts/im_put_size_realdata/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-official-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/im-put-size-realdata-20260902
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Diagnose official CFFEX archive
        run: python tools/diagnose_cffex_mo_archive.py
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/cffex_mo_archive_diagnostic/diagnostic.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "research: save CFFEX MO archive diagnostic"
            git push origin HEAD:codex/im-put-size-realdata-20260902
          fi
