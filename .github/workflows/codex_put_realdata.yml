name: Codex Put Real-Data Research

on:
  push:
    branches:
      - codex/im-put-size-realdata-20260902
    paths-ignore:
      - 'artifacts/cffex_mo_archive_diagnostic/**'
      - 'artifacts/im_author_put_quantity_ablation_v1/**'
      - 'tools/im_author_put_quantity_ablation_v1.payload2.*'
  workflow_dispatch:

concurrency:
  group: codex-im-put-realdata-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-real-data-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/im-put-size-realdata-20260902
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Restore official CFFEX archive cache
        uses: actions/cache@v4
        with:
          path: data/im_author_put_quantity_ablation_v1/cffex_raw
          key: cffex-im-mo-202207-202608-v1
          save-always: true
      - name: Validate frozen research source and specification
        run: |
          python -m py_compile im_author_put_quantity_ablation_v1.py tools/run_im_author_put_quantity_ablation_http_first.py
          test "$(sha256sum docs/im_author_put_quantity_ablation_v1_spec.md | awk '{print $1}')" = "b0e254ca27953fd3bd9ca9361ad25699bbc5effb294c5cfcf1670e9a90ed6db2"
      - name: Run preregistered real IM/MO Put quantity ablation
        run: python tools/run_im_author_put_quantity_ablation_http_first.py
      - name: Upload complete research output
        uses: actions/upload-artifact@v4
        with:
          name: im-author-put-quantity-ablation-v1
          path: artifacts/im_author_put_quantity_ablation_v1
          if-no-files-found: error
          retention-days: 90
      - name: Commit auditable results to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/im_author_put_quantity_ablation_v1
          if git diff --cached --quiet; then
            echo "No research result changes"
          else
            git commit -m "research: save author-style Put real-data ablation v1"
            git push origin HEAD:codex/im-put-size-realdata-20260902
          fi
