name: Codex Put Real-Data Research

on:
  push:
    branches:
      - codex/im-put-size-realdata-20260902
    paths-ignore:
      - 'artifacts/cffex_mo_archive_diagnostic/**'
      - 'artifacts/im_author_put_quantity_ablation_v1/**'
      - 'im_author_put_quantity_ablation_v1.py'
      - 'tools/im_author_put_quantity_ablation_v1.payload2.*'
  workflow_dispatch:

concurrency:
  group: codex-im-put-realdata-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe-real-data-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/im-put-size-realdata-20260902
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe CFFEX routing and alternate real-data endpoints
        shell: bash
        run: |
          set +e
          echo '=== DNS IPv4 / IPv6 ==='
          getent ahostsv4 www.cffex.com.cn || true
          getent ahostsv6 www.cffex.com.cn || true
          echo '=== direct CFFEX curl IPv4 ==='
          curl -4 -I -L --max-time 15 'https://www.cffex.com.cn/sj/historysj/202208/zip/202208.zip' || true
          echo '=== endpoint probes ==='
          python - <<'PY'
          from __future__ import annotations
          import json
          import requests
          from urllib.parse import quote

          probes = [
              (
                  'cffex_https',
                  'https://www.cffex.com.cn/sj/historysj/202208/zip/202208.zip',
                  None,
              ),
              (
                  'cffex_http',
                  'http://www.cffex.com.cn/sj/historysj/202208/zip/202208.zip',
                  None,
              ),
              (
                  'allorigins_cffex',
                  'https://api.allorigins.win/raw?url=' + quote('http://www.cffex.com.cn/sj/historysj/202208/zip/202208.zip', safe=''),
                  None,
              ),
              (
                  'isomorphic_git_cors_cffex',
                  'https://cors.isomorphic-git.org/http://www.cffex.com.cn/sj/historysj/202208/zip/202208.zip',
                  None,
              ),
              (
                  'jina_cffex',
                  'https://r.jina.ai/http://www.cffex.com.cn/sj/historysj/202208/zip/202208.zip',
                  None,
              ),
              (
                  'sina_im2208_daily',
                  'https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20_V21052021_4_12=/InnerFuturesNewService.getDailyKLine',
                  {'symbol': 'IM2208', 'type': '2021_04_12'},
              ),
              (
                  'sina_mo2208p6200_daily',
                  'https://stock.finance.sina.com.cn/futures/api/jsonp.php/var%20_mo2208P62002026_9_2=/FutureOptionAllService.getOptionDayline',
                  {'symbol': 'mo2208P6200'},
              ),
              (
                  'sina_mo2208_chain',
                  'https://stock.finance.sina.com.cn/futures/api/openapi.php/OptionService.getOptionData',
                  {'type': 'futures', 'product': 'mo', 'exchange': 'cffex', 'pinzhong': 'mo2208'},
              ),
              (
                  'csindex_000852',
                  'https://www.csindex.com.cn/csindex-home/perf/index-perf',
                  {'indexCode': '000852', 'startDate': '20220722', 'endDate': '20220831'},
              ),
          ]
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 Codex real-data source probe'})
          for name, url, params in probes:
              try:
                  response = session.get(url, params=params, timeout=(8, 20))
                  payload = response.content
                  prefix = payload[:120]
                  print(json.dumps({
                      'name': name,
                      'status': response.status_code,
                      'url': response.url,
                      'bytes': len(payload),
                      'content_type': response.headers.get('content-type'),
                      'zip_magic': payload[:4].hex(),
                      'prefix': prefix.decode('utf-8', errors='replace'),
                  }, ensure_ascii=False))
              except Exception as exc:
                  print(json.dumps({'name': name, 'error': repr(exc)}, ensure_ascii=False))
          PY
